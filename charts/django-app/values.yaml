image:
  # Must be overridden via an environment-specific values file, `helm --set`, or Terraform-generated values before deployment.
  repository: "REPLACE_ME"
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

ingress:
  enabled: false

config:
  POSTGRES_DB: django_db
  POSTGRES_USER: django_user
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432

secretEnv:
  POSTGRES_PASSWORD:
    secretName: django-db-secret
    secretKey: POSTGRES_PASSWORD
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
