image:
  # Must be overridden via an environment-specific values file, `helm --set`, or Terraform-generated values before deployment.
  repository: "472639102006.dkr.ecr.eu-west-2.amazonaws.com/ruday-final-project-ecr-repository"
  tag: 1
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

ingress:
  enabled: false

config:
  POSTGRES_HOST: ""
  POSTGRES_PORT: "5432"

secretEnv:
  POSTGRES_PASSWORD:
    secretName: django-secret
    secretKey: POSTGRES_PASSWORD
  SECRET_KEY:
    secretName: django-secret
    secretKey: SECRET_KEY
  POSTGRES_DB:
    secretName: django-secret
    secretKey: POSTGRES_DB
  POSTGRES_USER:
    secretName: django-secret
    secretKey: POSTGRES_USER
waitForDatabase:
  enabled: true
  image: postgres:16-alpine
  intervalSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
